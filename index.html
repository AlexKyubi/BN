<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Bonus Navigator</title>

    <meta name="theme-color" content="#2d7dff">
    <meta name="description" content="Bonus Navigator - каталог товаров с фильтрацией">
    <meta name="bn-frontend-version" content="1.4.1">
    <script>
        try {
            const savedHueRaw = localStorage.getItem("bn_theme_hue_v1");
            const savedHue = Number(savedHueRaw);
            if (savedHueRaw !== null && savedHueRaw !== "" && Number.isFinite(savedHue) && savedHue >= 0 && savedHue <= 360) {
                document.documentElement.style.setProperty("--accent-hue", String(Math.round(savedHue)));
            }
        } catch (error) { /* используется цвет по умолчанию */ }
    </script>
    
    <link rel="manifest" href="./public/manifest.json?v=1.4.1">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%232d7dff' width='192' height='192'/><text x='96' y='130' font-size='100' font-weight='bold' fill='white' text-anchor='middle'>BN</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%232d7dff' width='192' height='192'/><text x='96' y='130' font-size='100' font-weight='bold' fill='white' text-anchor='middle'>BN</text></svg>">

    <link rel="stylesheet" href="assets/styles/style.css?v=1.4.1">

</head>

<body>

<div id="app">

    <!-- ========================= -->
    <!-- Верхняя панель            -->
    <!-- ========================= -->

    <header id="header">

        <h1 id="logo">
            Bonus Navigator
        </h1>

        <span id="currentUser" class="current-user hidden" aria-live="polite"></span>

        <button id="installBtn" class="install-btn hidden" aria-label="Установить приложение">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="8 17 12 21 16 17"></polyline>
                <line x1="12" y1="12" x2="12" y2="21"></line>
                <path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"></path>
            </svg>
        </button>

    </header>

    <div id="summary" class="summary" aria-live="polite">
        <span id="resultCount">Загрузка товаров...</span>
        <span id="activeFilters"></span>
    </div>

    <div id="content">

        <aside id="starPanel" class="star-panel" aria-label="Фильтр по звёздам">
            <div class="panel-title">Звёзды</div>
            <div id="stars" class="star-list" role="group" aria-label="Выбор количества звёзд">
                <button type="button" class="star" data-stars="1" aria-label="1 звезда">☆</button>
                <button type="button" class="star" data-stars="2" aria-label="2 звезды">☆</button>
                <button type="button" class="star" data-stars="3" aria-label="3 звезды">☆</button>
                <button type="button" class="star" data-stars="4" aria-label="4 звезды">☆</button>
                <button type="button" class="star" data-stars="5" aria-label="5 звёзд">☆</button>
            </div>
            <button id="categoryToggle" class="categories-toggle-side" type="button" aria-label="Открыть категории">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
            </button>
            <button id="monthToggle" class="month-toggle-side" type="button" aria-label="Открыть месяцы">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span id="monthBadge" class="month-badge" aria-hidden="true"></span>
            </button>
            <button id="sortPriceBtn" class="sort-price-side" type="button" aria-pressed="false" aria-label="Сортировка по цене" title="Сортировка по цене: выключена">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 4v16"></path>
                    <polyline points="3 16 7 20 11 16"></polyline>
                    <line x1="14" y1="6" x2="21" y2="6"></line>
                    <line x1="14" y1="12" x2="19" y2="12"></line>
                    <line x1="14" y1="18" x2="17" y2="18"></line>
                </svg>
            </button>
            <button id="resetFiltersBtn" class="reset-filters-side" type="button" aria-label="Сбросить фильтры">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <polyline points="23 20 23 14 17 14"></polyline>
                    <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10"></path>
                    <path d="M3.51 15A9 9 0 0 0 18.36 18.36L23 14"></path>
                </svg>
            </button>
        </aside>

        <section id="mainContent" class="main-content">
            <div id="grid"></div>
        </section>

    </div>

    <div id="searchBar" class="search-bar">
        <input
            id="search"
            type="search"
            inputmode="text"
            autocapitalize="characters"
            placeholder="Поиск по артикулу или модели..."
            autocomplete="off"
            spellcheck="false"
            aria-label="Поиск по артикулу или модели">
        <button id="scanQrBtn" type="button" class="scan-qr-btn" aria-label="Сканировать QR код">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 3h6v6H3zM15 3h6v6h-6zM3 15h6v6H3zM17 17v-1h1v1h1v-2h-2v2zM19 19v-1h1v1zM17 19h1v1h-1z"/>
                <line x1="9" y1="21" x2="21" y2="9"/>
            </svg>
        </button>
    </div>

    <button id="scrollTop" class="scroll-top" type="button" aria-label="Наверх">Наверх</button>

    <div id="categoryDrawer" class="category-drawer hidden" aria-hidden="true" inert>
        <div class="drawer-panel">
            <div class="drawer-header">
                <span>Категории</span>
                <button id="closeCategoryDrawer" type="button" aria-label="Закрыть категории">×</button>
            </div>
            <div id="categoryList" class="category-list"></div>
        </div>
        <div class="drawer-backdrop" id="drawerBackdrop"></div>
    </div>

    <div id="monthDrawer" class="category-drawer month-drawer hidden" aria-hidden="true" inert>
        <div class="drawer-panel">
            <div class="drawer-header">
                <span>Месяцы</span>
                <button id="closeMonthDrawer" type="button" aria-label="Закрыть месяцы">×</button>
            </div>
            <div id="monthList" class="category-list"></div>
        </div>
        <div class="drawer-backdrop" id="monthDrawerBackdrop"></div>
    </div>

    <!-- QR Scanner Modal -->
    <div id="qrScannerModal" class="qr-scanner-modal hidden">
        <div class="qr-scanner-backdrop"></div>
        <div class="qr-scanner-container">
            <div class="qr-scanner-header">
                <h2>Сканирование QR кода</h2>
                <button id="closeQrScanner" type="button" class="close-btn" aria-label="Закрыть сканер">×</button>
            </div>
            <video id="qrVideo" width="100%" height="auto" autoplay playsinline muted webkit-playsinline style="max-height: 400px; background: #000;"></video>
            <div class="qr-scanner-status" id="qrStatus">Разрешите доступ к камере...</div>
            <button id="stopQrScanner" type="button" class="stop-btn" aria-label="Остановить сканирование">Остановить</button>
        </div>
    </div>

</div>



<!-- ====================================== -->
<!-- Полноэкранный просмотр изображения     -->
<!-- ====================================== -->

<div id="viewer" class="hidden">

    <div id="viewerBackground"></div>

    <button id="viewerClose" type="button" aria-label="Закрыть просмотр">×</button>

    <img
        id="viewerImage"
        src=""
        alt="">

</div>

<div id="authModal" class="auth-modal hidden" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="auth-backdrop"></div>
    <div class="auth-content">
        <h2 id="authTitle">Вход в Bonus Navigator</h2>
        <p class="auth-subtitle">Авторизуйтесь один раз на этом устройстве</p>

        <form id="authForm" class="auth-form" autocomplete="on">
            <label class="auth-label" for="authLogin">Логин (Фамилия Имя)</label>
            <input id="authLogin" name="username" type="text" class="auth-input" autocomplete="name" placeholder="Например: Иванов Иван" required>

            <label class="auth-label" for="authSheetUrl">Ссылка на Google Sheets</label>
            <input id="authSheetUrl" name="sheetUrl" type="url" class="auth-input" autocomplete="off" placeholder="https://docs.google.com/spreadsheets/d/.../edit?gid=0#gid=0" required>

            <div id="authError" class="auth-error" aria-live="polite"></div>
            <button id="authSubmit" type="submit" class="btn-primary auth-submit">Войти</button>
        </form>
    </div>
</div>

<div id="reportPasswordModal" class="install-modal hidden" role="dialog" aria-modal="true" aria-labelledby="reportPasswordTitle">
    <div class="modal-backdrop" id="reportPasswordBackdrop"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="reportPasswordTitle">Пароль отчёта</h2>
            <button id="closeReportPasswordModal" type="button" class="close-btn" aria-label="Закрыть">×</button>
        </div>
        <form id="reportPasswordForm" class="modal-form">
            <div class="modal-body">
                <label class="auth-label" for="reportPasswordInput">Введите пароль для скачивания отчёта</label>
                <input id="reportPasswordInput" type="password" class="auth-input" autocomplete="current-password" required>
                <div id="reportPasswordError" class="auth-error" aria-live="polite"></div>
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn-primary">Скачать</button>
                <button id="cancelReportPasswordBtn" type="button" class="btn-secondary">Отмена</button>
            </div>
        </form>
    </div>
</div>

<div id="stockInfoModal" class="stock-info-drawer hidden" role="dialog" aria-modal="true" aria-labelledby="stockInfoTitle" aria-hidden="true" inert>
    <div class="drawer-backdrop" id="stockInfoBackdrop"></div>
    <div class="drawer-panel stock-info-panel">
        <div class="drawer-header">
            <span id="stockInfoTitle">Остатки по товару</span>
            <button id="closeStockInfoModal" type="button" aria-label="Закрыть">×</button>
        </div>
        <div class="stock-info-scroll">
            <div id="stockInfoBody" class="stock-info-body"></div>
        </div>
    </div>
</div>



<!-- ====================================== -->
<!-- Шаблон карточки товара                 -->
<!-- ====================================== -->

<template id="cardTemplate">

    <article class="card">

        <div class="card-stars"></div>

        <div class="card-image">

            <img
                class="photo"
                src=""
                alt=""
                loading="lazy"
                decoding="async"
                draggable="false">

        </div>

        <div class="card-meta">
            <div class="card-title"></div>
            <div class="card-price"></div>
            <div class="card-article-row">
                <div class="card-article"></div>
                <button type="button" class="card-sale-btn" aria-label="Добавить продажу" title="Добавить продажу">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1"></circle><circle cx="19" cy="20" r="1"></circle><path d="M3 4h2l2.4 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7H6"></path><path d="M14 9v4M12 11h4"></path></svg>
                </button>
            </div>
            <button type="button" class="card-stock-info" aria-label="Показать остатки">i</button>
        </div>

        <div class="card-model">

        </div>

    </article>

</template>

<div id="saleModal" class="install-modal hidden" role="dialog" aria-modal="true" aria-labelledby="saleModalTitle">
    <div id="saleBackdrop" class="modal-backdrop"></div>
    <form id="saleForm" class="modal-content">
        <div class="modal-header"><h2 id="saleModalTitle">Добавить продажу</h2><button id="closeSaleModal" type="button" class="close-btn">×</button></div>
        <div class="modal-body profile-body">
            <strong id="saleProductTitle"></strong><span id="saleProductArticle" class="profile-updated-at"></span>
            <label class="auth-label" for="saleDate">Дата продажи</label><input id="saleDate" class="auth-input" type="date" required>
            <label class="auth-label" for="salePrice">Цена продажи</label><input id="salePrice" class="auth-input" type="number" min="0" step="0.01" required>
            <label class="auth-label" for="saleQuantity">Количество</label><input id="saleQuantity" class="auth-input" type="number" min="1" step="1" value="1" required>
            <div id="saleCalculation" class="profile-update"></div><div id="saleStatus" class="auth-error" aria-live="polite"></div>
        </div>
        <div class="modal-footer"><button class="btn-primary" type="submit">Подтвердить продажу</button><button id="cancelSaleModal" class="btn-secondary" type="button">Отмена</button></div>
    </form>
</div>



<!-- ====================================== -->
<!-- Скрипты                                -->
<!-- ====================================== -->

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script type="module" src="assets/scripts/app.js?v=1.4.1"></script>

<!-- Service Worker и PWA регистрация -->
<script>
if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
    console.warn('⚠️ PWA работает только на HTTPS или localhost!');
}

// Регистрация Service Worker
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then(reg => {
                if (!reg) {
                    console.warn('Service Worker недоступен в текущем режиме браузера.');
                }
            })
            .catch(err => {
                console.warn('Не удалось зарегистрировать Service Worker:', err);
            });
    });
} else {
    console.warn('⚠️ Service Worker не поддерживается');
}

</script>

</body>

</html>
